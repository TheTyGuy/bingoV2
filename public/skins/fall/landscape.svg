<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3f78"/>
      <stop offset="0.35" stop-color="#b65c74"/>
      <stop offset="0.62" stop-color="#f08a5d"/>
      <stop offset="0.8" stop-color="#ffc46b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.35" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b36b"/>
      <stop offset="1" stop-color="#8a4f5c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3d1a"/>
      <stop offset="1" stop-color="#3f2010"/>
    </linearGradient>
    <g id="tree">
      <rect x="-5" y="0" width="10" height="46" fill="#3f2414"/>
      <circle cx="0" cy="-10" r="30"/>
      <circle cx="-22" cy="6" r="22"/>
      <circle cx="22" cy="4" r="24"/>
      <circle cx="6" cy="-34" r="20"/>
    </g>
    <g id="pine"><polygon points="0,-60 26,10 -26,10"/><rect x="-3" y="10" width="6" height="12" fill="#2b1a12"/></g>
    <g id="pumpkin">
      <ellipse cx="-22" cy="0" rx="26" ry="30" fill="#d9661f"/>
      <ellipse cx="22" cy="0" rx="26" ry="30" fill="#d9661f"/>
      <ellipse cx="0" cy="0" rx="26" ry="32" fill="#ef8a2e"/>
      <path d="M-30 -18 Q-36 0 -30 18 M30 -18 Q36 0 30 18 M-10 -28 Q-14 0 -10 28 M10 -28 Q14 0 10 28" stroke="#b44d14" stroke-width="3" fill="none"/>
      <path d="M0 -30 Q4 -44 12 -48" stroke="#4d5a1c" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="600" cy="470" r="260" fill="url(#sun)"/>
  <g fill="#ffb37a" opacity="0.55">
    <ellipse cx="220" cy="170" rx="140" ry="22"/><ellipse cx="330" cy="200" rx="110" ry="16"/>
    <ellipse cx="900" cy="130" rx="170" ry="24"/><ellipse cx="1040" cy="170" rx="120" ry="18"/>
    <ellipse cx="620" cy="260" rx="200" ry="14"/>
  </g>

  <!-- distant hills and pines -->
  <path d="M0 520 Q150 430 320 480 T640 470 T960 450 T1200 480 V900 H0Z" fill="#8c4e6a" opacity="0.85"/>
  <g fill="#4f3a4f">
    <use href="#pine" x="90" y="500" transform="scale(0.8)"/><use href="#pine" x="160" y="480"/>
    <use href="#pine" x="210" y="495" transform="scale(0.9)"/><use href="#pine" x="1090" y="470"/>
    <use href="#pine" x="1150" y="490" transform="scale(0.9)"/>
  </g>
  <path d="M0 590 Q200 520 380 570 T760 560 T1200 545 V900 H0Z" fill="#a4512e"/>

  <!-- river with bridge on the left -->
  <path d="M0 650 Q140 630 250 660 Q330 690 300 900 H0Z" fill="url(#river)"/>
  <g fill="#8a7466" stroke="#4a3a32" stroke-width="3">
    <path d="M40 640 Q150 560 260 640 L260 660 Q150 600 40 660Z"/>
  </g>

  <!-- farmhouse on the right -->
  <g transform="translate(930 470)">
    <rect x="0" y="60" width="200" height="110" fill="#efe3cf" stroke="#4a2c1a" stroke-width="3"/>
    <polygon points="-14,64 100,0 214,64" fill="#5e4a55" stroke="#2e1f24" stroke-width="3"/>
    <rect x="70" y="-70" width="40" height="80" fill="#efe3cf" stroke="#4a2c1a" stroke-width="3"/>
    <polygon points="64,-68 90,-140 116,-68" fill="#5e4a55" stroke="#2e1f24" stroke-width="3"/>
    <g fill="#ffcf6b" stroke="#4a2c1a" stroke-width="2">
      <rect x="20" y="90" width="26" height="34"/><rect x="154" y="90" width="26" height="34"/>
      <rect x="84" y="-46" width="12" height="20"/><rect x="85" y="100" width="30" height="70"/>
    </g>
    <circle cx="100" cy="40" r="14" fill="none" stroke="#7b2a1a" stroke-width="6"/>
  </g>

  <!-- autumn trees on the middle hills -->
  <g fill="#d9661f"><use href="#tree" x="360" y="545"/><use href="#tree" x="840" y="540"/></g>
  <g fill="#b3261e"><use href="#tree" x="420" y="560" transform="translate(0 0)"/><use href="#tree" x="1170" y="590"/></g>
  <g fill="#f0a020"><use href="#tree" x="790" y="560"/><use href="#tree" x="890" y="575"/></g>

  <!-- foreground ground -->
  <path d="M0 720 Q300 660 600 700 T1200 690 V900 H0Z" fill="url(#ground)"/>

  <!-- big framing tree on the left -->
  <g>
    <path d="M30 900 C40 700 20 520 70 380 C90 330 130 300 170 280 L180 300 C140 330 110 380 100 440 C90 560 110 720 120 900Z" fill="#3a2414"/>
    <g fill="#c4421b"><circle cx="40" cy="300" r="90"/><circle cx="170" cy="250" r="80"/><circle cx="0" cy="190" r="110"/></g>
    <g fill="#e8781f"><circle cx="110" cy="200" r="70"/><circle cx="240" cy="200" r="55"/><circle cx="60" cy="110" r="80"/></g>
    <g fill="#f4a72e" opacity="0.9"><circle cx="190" cy="160" r="40"/><circle cx="20" cy="260" r="40"/></g>
  </g>

  <!-- fence on the right -->
  <g fill="#6b4226" stroke="#2e1a0e" stroke-width="3">
    <rect x="960" y="700" width="22" height="130"/><rect x="1100" y="690" width="22" height="140"/>
    <rect x="880" y="730" width="320" height="16"/><rect x="880" y="775" width="320" height="16"/>
  </g>

  <!-- pumpkins and hay -->
  <path d="M60 900 Q140 820 300 840 Q360 850 380 900Z" fill="#d6a640"/>
  <path d="M90 880 l20 -30 M140 870 l10 -35 M200 865 l-6 -30 M250 872 l14 -28" stroke="#b07c26" stroke-width="4"/>
  <use href="#pumpkin" x="180" y="830" transform="translate(0 0)"/>
  <g transform="translate(290 860) scale(0.7)"><use href="#pumpkin"/></g>
  <g transform="translate(1080 850) scale(0.85)"><use href="#pumpkin"/></g>
  <g fill="#b3261e"><circle cx="860" cy="860" r="9"/><circle cx="880" cy="870" r="8"/><circle cx="1180" cy="860" r="9"/></g>
  <g fill="#f0a020"><circle cx="900" cy="860" r="8"/><circle cx="1150" cy="870" r="8"/><circle cx="845" cy="880" r="7"/></g>
</svg>
